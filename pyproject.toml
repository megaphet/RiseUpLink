[project]
name = "riseuplink"
version = "1.0.0"
description = "DengRiseUp RiseUpLink Flask application"
dependencies = [
    "Flask==2.2.5",
    "Flask-Login==0.6.2",
    "Flask-SQLAlchemy==2.5.1",
    "SQLAlchemy==1.4.49",
    "Werkzeug==2.2.3",
    "requests==2.31.0",
    "supabase",
    "Flask-WTF==1.1.1",
    "Flask-Migrate==3.1.0",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.vercel.scripts]
build = "pip install -r requirements.txt"

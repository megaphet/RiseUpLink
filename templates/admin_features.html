{% extends 'base.html' %}
{% block content %}
  <div class="container py-4">
    <h1>Feature Flags</h1>
    <p class="lead">Toggle platform features.</p>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="enable_media_gallery" name="enable_media_gallery" {% if features.enable_media_gallery %}checked{% endif %}>
        <label class="form-check-label" for="enable_media_gallery">Enable media gallery</label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="enable_recommendations" name="enable_recommendations" {% if features.enable_recommendations %}checked{% endif %}>
        <label class="form-check-label" for="enable_recommendations">Enable recommendations</label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="enable_verifications" name="enable_verifications" {% if features.enable_verifications %}checked{% endif %}>
        <label class="form-check-label" for="enable_verifications">Enable verifications</label>
      </div>
      <button class="btn btn-primary" type="submit">Save</button>
    </form>
  </div>
{% endblock %}
